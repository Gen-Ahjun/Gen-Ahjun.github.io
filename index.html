<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------------- Design tokens ---------------- */
const C = {
  cover: "#1F1B15", coverText: "#E9D9AE", coverTextDim: "#B3A07A",
  page: "#ECE1C8", card: "#F7F0DE", cardBorder: "#D9C9A0",
  ink: "#2B2115", inkMuted: "#79684E",
  brass: "#A9782E", brassDark: "#8A611F",
  green: "#3F5C46", greenSoft: "#E1EAE0",
  red: "#8C3B32",
};

const PRESETS = {
  dnd: { label: "Classic fantasy (10:1)", denominations: [
    { id: "pp", name: "Platinum", abbr: "pp", value: 1000 },
    { id: "gp", name: "Gold", abbr: "gp", value: 100 },
    { id: "sp", name: "Silver", abbr: "sp", value: 10 },
    { id: "cp", name: "Copper", abbr: "cp", value: 1 },
  ]},
  percentile: { label: "Gold & silver (100:1)", denominations: [
    { id: "gp", name: "Gold", abbr: "gp", value: 100 },
    { id: "sp", name: "Silver", abbr: "sp", value: 1 },
  ]},
  single: { label: "Single currency (e.g. caps)", denominations: [
    { id: "caps", name: "Caps", abbr: "caps", value: 1 },
  ]},
};

const DEFAULT_STATE = {
  party: { name: "The Party", gold: 0 },
  currency: PRESETS.dnd.denominations,
  players: [],
  items: [],
};

const TYPE_SUGGESTIONS = ["Weapon", "Armor", "Potion", "Scroll", "Tool", "Trinket", "Misc"];

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function breakdown(base, denominations) {
  const sorted = [...denominations].sort((a, b) => b.value - a.value);
  let remaining = Math.max(0, Math.round(base || 0));
  const parts = [];
  sorted.forEach((d) => {
    const count = Math.floor(remaining / d.value);
    remaining -= count * d.value;
    if (count > 0) parts.push({ ...d, count });
  });
  if (parts.length === 0) {
    const smallest = sorted[sorted.length - 1];
    if (smallest) parts.push({ ...smallest, count: 0 });
  }
  return parts;
}

function validateDenoms(denoms) {
  if (!denoms.length) return "Add at least one denomination.";
  for (const d of denoms) {
    if (!d.name.trim() || !d.abbr.trim()) return "Every denomination needs a name and abbreviation.";
    if (!(d.value > 0) || !Number.isInteger(Number(d.value))) return "Values must be whole numbers greater than zero.";
  }
  const smallest = Math.min(...denoms.map((d) => Number(d.value)));
  if (smallest !== 1) return "Your smallest denomination must have a value of 1 (the base unit everything else is measured against).";
  return null;
}

function formatDate(ts) {
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function filterAndSort(items, { type, source, sort, search }) {
  let list = items.slice();
  if (type !== "all") list = list.filter((i) => i.type === type);
  if (source !== "all") list = list.filter((i) => i.source === source);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    list = list.filter((i) => i.name.toLowerCase().includes(q));
  }
  switch (sort) {
    case "oldest": list.sort((a, b) => a.addedAt - b.addedAt); break;
    case "cost-desc": list.sort((a, b) => b.cost - a.cost); break;
    case "cost-asc": list.sort((a, b) => a.cost - b.cost); break;
    case "name": list.sort((a, b) => a.name.localeCompare(b.name)); break;
    default: list.sort((a, b) => b.addedAt - a.addedAt);
  }
  return list;
}

/* ---------------- Shared UI ---------------- */
function CoinBreakdown({ base, denominations, size }) {
  const parts = breakdown(base, denominations);
  return (
    <div className="flex flex-wrap gap-1.5">
      {parts.map((p) => (
        <span key={p.id} className={`inline-flex items-center gap-1 rounded-full ${size === "sm" ? "px-2 py-0.5 text-xs" : "px-2.5 py-1 text-sm"}`}
          style={{ background: C.card, border: `1px solid ${C.cardBorder}`, color: C.inkMuted }}>
          <span className="font-semibold" style={{ color: C.brassDark }}>{p.count}</span>{p.abbr}
        </span>
      ))}
    </div>
  );
}

function Pill({ children, tone }) {
  const t = tone === "green" ? { background: C.greenSoft, border: C.green, color: C.green } : { background: C.card, border: C.cardBorder, color: C.inkMuted };
  return <span className="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium" style={{ background: t.background, border: `1px solid ${t.border}`, color: t.color }}>{children}</span>;
}

function FilterBar({ items, type, setType, source, setSource, sort, setSort, search, setSearch }) {
  const types = Array.from(new Set(items.map((i) => i.type))).sort();
  const sources = Array.from(new Set(items.map((i) => i.source))).sort();
  const s = { background: C.card, border: `1px solid ${C.cardBorder}`, color: C.ink };
  return (
    <div className="flex flex-wrap gap-2 items-center mb-3">
      <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search by name"
        className="flex-1 min-w-[140px] rounded-md px-2 py-1.5 text-sm outline-none" style={s} />
      <select value={type} onChange={(e) => setType(e.target.value)} className="rounded-md px-2 py-1.5 text-sm outline-none" style={s}>
        <option value="all">All types</option>
        {types.map((t) => <option key={t} value={t}>{t}</option>)}
      </select>
      <select value={source} onChange={(e) => setSource(e.target.value)} className="rounded-md px-2 py-1.5 text-sm outline-none" style={s}>
        <option value="all">Any source</option>
        {sources.map((so) => <option key={so} value={so}>{so}</option>)}
      </select>
      <select value={sort} onChange={(e) => setSort(e.target.value)} className="rounded-md px-2 py-1.5 text-sm outline-none" style={s}>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="cost-desc">Cost: high to low</option>
        <option value="cost-asc">Cost: low to high</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  );
}

function ConfirmButton({ onConfirm, label = "Remove", confirmLabel = "Confirm?" }) {
  const [confirming, setConfirming] = useState(false);
  useEffect(() => {
    if (!confirming) return;
    const t = setTimeout(() => setConfirming(false), 3000);
    return () => clearTimeout(t);
  }, [confirming]);
  return (
    <button onClick={() => (confirming ? (onConfirm(), setConfirming(false)) : setConfirming(true))}
      className="rounded-md px-2 py-1 text-xs font-medium"
      style={confirming ? { background: C.red, color: "#fff" } : { background: "transparent", color: C.red, border: `1px solid ${C.red}` }}>
      {confirming ? confirmLabel : label}
    </button>
  );
}

function ItemDescription({ text }) {
  const [expanded, setExpanded] = useState(false);
  if (!text) return null;
  const paragraphs = text.split(/\n+/).map((s) => s.trim()).filter(Boolean);
  return (
    <div className="mt-1">
      <button
        onClick={() => setExpanded(!expanded)}
        className="text-xs font-medium"
        style={{ color: C.brassDark }}
      >
        {expanded ? "Hide description ▲" : "Show description ▼"}
      </button>
      {expanded && (
        <div className="mt-1.5 space-y-1.5 text-sm" style={{ color: C.inkMuted, maxWidth: 520 }}>
          {paragraphs.map((p, i) => (
            <p key={i}>{p}</p>
          ))}
        </div>
      )}
    </div>
  );
}

function LootRow({ item, denominations, players, right }) {
  const owner = item.claimedBy ? players.find((p) => p.id === item.claimedBy) : null;
  return (
    <div className="rounded-lg p-3 flex flex-wrap items-center gap-3 justify-between" style={{ background: C.card, border: `1px solid ${C.cardBorder}` }}>
      <div className="flex-1 min-w-[220px]">
        <div className="font-medium" style={{ color: C.ink }}>{item.name}</div>
        <ItemDescription text={item.description} />
        <div className="flex flex-wrap gap-1.5 mt-1">
          <Pill>{item.type}</Pill>
          <Pill>from {item.source}</Pill>
          <Pill>{formatDate(item.addedAt)}</Pill>
          {owner && <Pill tone="green">claimed by {owner.name}</Pill>}
        </div>
      </div>
      <div className="flex items-center gap-3">
        <CoinBreakdown base={item.cost} denominations={denominations} size="sm" />
        {right}
      </div>
    </div>
  );
}

/* ---------------- DM Tab ---------------- */
function DMTab({ state, actions }) {
  const [partyName, setPartyName] = useState(state.party.name);
  const [editingCurrency, setEditingCurrency] = useState(false);
  const [draftDenoms, setDraftDenoms] = useState(() => state.currency.map((d) => ({ ...d })));
  const [currencyError, setCurrencyError] = useState(null);
  const [newPlayer, setNewPlayer] = useState("");
  const [itemName, setItemName] = useState("");
  const [itemType, setItemType] = useState("");
  const [itemSource, setItemSource] = useState("");
  const [itemDescription, setItemDescription] = useState("");
  const [costAmount, setCostAmount] = useState("");
  const [costDenom, setCostDenom] = useState(state.currency[state.currency.length - 1]?.id || "");
  const [logType, setLogType] = useState("all");
  const [logSource, setLogSource] = useState("all");
  const [logSort, setLogSort] = useState("newest");
  const [logSearch, setLogSearch] = useState("");

  const denomOptions = state.currency;
  const filteredLog = filterAndSort(state.items, { type: logType, source: logSource, sort: logSort, search: logSearch });
  const inputStyle = { background: C.card, border: `1px solid ${C.cardBorder}`, color: C.ink };
  const sectionTitle = "font-display text-lg mb-2";
  const label = "block text-xs font-medium mb-1";

  function startEditingCurrency() {
    setDraftDenoms(state.currency.map((d) => ({ ...d })));
    setCurrencyError(null);
    setEditingCurrency(true);
  }
  function saveCurrency() {
    const err = validateDenoms(draftDenoms);
    if (err) { setCurrencyError(err); return; }
    actions.saveCurrency(draftDenoms.map((d) => ({ ...d, value: Number(d.value) })));
    setEditingCurrency(false);
  }
  function submitItem(e) {
    e.preventDefault();
    if (!itemName.trim()) return;
    const denom = denomOptions.find((d) => d.id === costDenom) || denomOptions[0];
    const amount = parseFloat(costAmount) || 0;
    const costBase = Math.round(amount * (denom ? denom.value : 1));
    actions.addItem({ name: itemName.trim(), type: itemType.trim() || "Misc", source: itemSource.trim() || "Unknown", description: itemDescription.trim(), cost: costBase });
    setItemName(""); setItemType(""); setItemSource(""); setItemDescription(""); setCostAmount("");
  }

  return (
    <div className="space-y-8">
      <section>
        <h2 className={sectionTitle} style={{ color: C.ink }}>Party settings</h2>
        <div className="flex items-center gap-2 mb-4">
          <input value={partyName} onChange={(e) => setPartyName(e.target.value)}
            onBlur={() => partyName.trim() && actions.renameParty(partyName.trim())}
            className="rounded-md px-3 py-1.5 text-sm outline-none" style={{ ...inputStyle, minWidth: 220 }} />
          <span className="text-xs" style={{ color: C.inkMuted }}>Party name</span>
        </div>
        <div className="rounded-lg p-4" style={{ background: C.card, border: `1px solid ${C.cardBorder}` }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-medium" style={{ color: C.ink }}>Currency system</h3>
            {!editingCurrency && (
              <button onClick={startEditingCurrency} className="rounded-md px-2 py-1 text-xs font-medium" style={{ border: `1px solid ${C.brass}`, color: C.brassDark }}>Edit</button>
            )}
          </div>
          {!editingCurrency ? (
            <div className="flex flex-wrap gap-2">
              {state.currency.slice().sort((a, b) => b.value - a.value).map((d) => (
                <Pill key={d.id}>{d.name} ({d.abbr}) = {d.value}</Pill>
              ))}
            </div>
          ) : (
            <div className="space-y-3">
              <div className="flex flex-wrap gap-2">
                {Object.entries(PRESETS).map(([key, preset]) => (
                  <button key={key} onClick={() => setDraftDenoms(preset.denominations.map((d) => ({ ...d })))}
                    className="rounded-md px-2 py-1 text-xs" style={{ border: `1px solid ${C.cardBorder}`, color: C.inkMuted }}>{preset.label}</button>
                ))}
              </div>
              <div className="space-y-2">
                {draftDenoms.map((d, idx) => (
                  <div key={d.id} className="flex items-center gap-2">
                    <input value={d.name} onChange={(e) => { const n = [...draftDenoms]; n[idx] = { ...d, name: e.target.value }; setDraftDenoms(n); }}
                      placeholder="Name" className="rounded-md px-2 py-1 text-sm outline-none flex-1" style={inputStyle} />
                    <input value={d.abbr} onChange={(e) => { const n = [...draftDenoms]; n[idx] = { ...d, abbr: e.target.value }; setDraftDenoms(n); }}
                      placeholder="Abbr" className="rounded-md px-2 py-1 text-sm outline-none w-16" style={inputStyle} />
                    <span className="text-xs" style={{ color: C.inkMuted }}>=</span>
                    <input value={d.value} type="number" min="1" onChange={(e) => { const n = [...draftDenoms]; n[idx] = { ...d, value: e.target.value }; setDraftDenoms(n); }}
                      className="rounded-md px-2 py-1 text-sm outline-none w-20" style={inputStyle} />
                    <span className="text-xs" style={{ color: C.inkMuted }}>base units</span>
                    <button onClick={() => setDraftDenoms(draftDenoms.filter((_, i) => i !== idx))} className="ml-auto text-sm" style={{ color: C.red }}>✕</button>
                  </div>
                ))}
              </div>
              <button onClick={() => setDraftDenoms([...draftDenoms, { id: genId(), name: "", abbr: "", value: 1 }])}
                className="text-xs font-medium" style={{ color: C.brassDark }}>+ Add denomination</button>
              {currencyError && <p className="text-xs" style={{ color: C.red }}>{currencyError}</p>}
              <p className="text-xs" style={{ color: C.inkMuted }}>The smallest denomination must equal 1 — that's the base unit everything else is priced in. Changing this doesn't rescale gold or item costs already on the books.</p>
              <div className="flex gap-2">
                <button onClick={saveCurrency} className="rounded-md px-3 py-1.5 text-sm font-medium" style={{ background: C.brass, color: "#fff" }}>Save changes</button>
                <button onClick={() => setEditingCurrency(false)} className="rounded-md px-3 py-1.5 text-sm" style={{ border: `1px solid ${C.cardBorder}`, color: C.inkMuted }}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      </section>

      <section>
        <h2 className={sectionTitle} style={{ color: C.ink }}>Party members</h2>
        <div className="flex gap-2 mb-3">
          <input value={newPlayer} onChange={(e) => setNewPlayer(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && newPlayer.trim()) { actions.addPlayer(newPlayer.trim()); setNewPlayer(""); } }}
            placeholder="New player's name" className="rounded-md px-3 py-1.5 text-sm outline-none flex-1" style={inputStyle} />
          <button onClick={() => { if (newPlayer.trim()) { actions.addPlayer(newPlayer.trim()); setNewPlayer(""); } }}
            className="rounded-md px-3 py-1.5 text-sm font-medium" style={{ background: C.brass, color: "#fff" }}>+ Add</button>
        </div>
        {state.players.length === 0 ? (
          <p className="text-sm" style={{ color: C.inkMuted }}>No one's in the party yet. Add your players above.</p>
        ) : (
          <div className="space-y-2">
            {state.players.map((p) => (
              <div key={p.id} className="rounded-lg p-3 flex flex-wrap items-center justify-between gap-2" style={{ background: C.card, border: `1px solid ${C.cardBorder}` }}>
                <div className="font-medium" style={{ color: C.ink }}>{p.name}</div>
                <div className="flex items-center gap-3">
                  <CoinBreakdown base={p.gold} denominations={state.currency} size="sm" />
                  <ConfirmButton onConfirm={() => actions.removePlayer(p.id)} label="Remove" confirmLabel="Remove for good?" />
                </div>
              </div>
            ))}
          </div>
        )}
      </section>

      <section>
        <h2 className={sectionTitle} style={{ color: C.ink }}>Add an item to the party loot</h2>
        <form onSubmit={submitItem} className="rounded-lg p-4 space-y-3" style={{ background: C.card, border: `1px solid ${C.cardBorder}` }}>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className={label} style={{ color: C.inkMuted }}>Item name</label>
              <input value={itemName} onChange={(e) => setItemName(e.target.value)} required className="w-full rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle} />
            </div>
            <div>
              <label className={label} style={{ color: C.inkMuted }}>Type</label>
              <input list="type-suggestions" value={itemType} onChange={(e) => setItemType(e.target.value)} placeholder="Misc" className="w-full rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle} />
              <datalist id="type-suggestions">
                {Array.from(new Set([...TYPE_SUGGESTIONS, ...state.items.map((i) => i.type)])).map((t) => <option key={t} value={t} />)}
              </datalist>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className={label} style={{ color: C.inkMuted }}>Where it came from</label>
              <input list="source-suggestions" value={itemSource} onChange={(e) => setItemSource(e.target.value)} placeholder="e.g. Goblin ambush" className="w-full rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle} />
              <datalist id="source-suggestions">
                {Array.from(new Set(state.items.map((i) => i.source))).map((s) => <option key={s} value={s} />)}
              </datalist>
            </div>
            <div>
              <label className={label} style={{ color: C.inkMuted }}>Cost</label>
              <div className="flex gap-2">
                <input type="number" min="0" step="any" value={costAmount} onChange={(e) => setCostAmount(e.target.value)} placeholder="0" className="w-full rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle} />
                <select value={costDenom} onChange={(e) => setCostDenom(e.target.value)} className="rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle}>
                  {denomOptions.map((d) => <option key={d.id} value={d.id}>{d.abbr}</option>)}
                </select>
              </div>
            </div>
          </div>
          <div>
            <label className={label} style={{ color: C.inkMuted }}>Description (optional)</label>
            <textarea
              value={itemDescription}
              onChange={(e) => setItemDescription(e.target.value)}
              placeholder="What does it do? Press Enter to start a new paragraph (e.g. separate abilities)."
              rows={4}
              className="w-full rounded-md px-2 py-1.5 text-sm outline-none resize-y"
              style={inputStyle}
            />
          </div>
          <button type="submit" className="rounded-md px-3 py-1.5 text-sm font-medium" style={{ background: C.brass, color: "#fff" }}>+ Add to party loot</button>
        </form>
      </section>

      <section>
        <h2 className={sectionTitle} style={{ color: C.ink }}>Full loot log</h2>
        <FilterBar items={state.items} type={logType} setType={setLogType} source={logSource} setSource={setLogSource} sort={logSort} setSort={setLogSort} search={logSearch} setSearch={setLogSearch} />
        {filteredLog.length === 0 ? (
          <p className="text-sm" style={{ color: C.inkMuted }}>No items match. Add loot above, or clear your filters.</p>
        ) : (
          <div className="space-y-2">
            {filteredLog.map((item) => (
              <LootRow key={item.id} item={item} denominations={state.currency} players={state.players}
                right={<ConfirmButton onConfirm={() => actions.deleteItem(item.id)} />} />
            ))}
          </div>
        )}
      </section>
    </div>
  );
}

function OwnerFilter({ players, selected, onToggle, onClear }) {
  const options = [{ id: "unclaimed", label: "Party loot (unclaimed)" }, ...players.map((p) => ({ id: p.id, label: p.name }))];
  return (
    <div className="flex flex-wrap items-center gap-1.5 mb-3">
      <span className="text-xs" style={{ color: C.inkMuted }}>Who has it:</span>
      {options.map((opt) => {
        const active = selected.has(opt.id);
        return (
          <button
            key={opt.id}
            onClick={() => onToggle(opt.id)}
            className="rounded-full px-3 py-1 text-xs font-medium"
            style={active ? { background: C.brass, color: "#fff" } : { background: C.card, border: `1px solid ${C.cardBorder}`, color: C.inkMuted }}
          >
            {opt.label}
          </button>
        );
      })}
      {selected.size > 0 && (
        <button onClick={onClear} className="text-xs underline" style={{ color: C.inkMuted }}>Clear</button>
      )}
    </div>
  );
}

/* ---------------- Party Tab ---------------- */
function PartyTab({ state, actions }) {
  const [addAmount, setAddAmount] = useState("");
  const [addDenom, setAddDenom] = useState(state.currency[state.currency.length - 1]?.id || "");
  const [splitMsg, setSplitMsg] = useState(null);
  const [claimSelections, setClaimSelections] = useState({});
  const [type, setType] = useState("all");
  const [source, setSource] = useState("all");
  const [sort, setSort] = useState("newest");
  const [search, setSearch] = useState("");
  const [ownerFilter, setOwnerFilter] = useState(() => new Set());

  function toggleOwner(id) {
    setOwnerFilter((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }

  const ownerFiltered = ownerFilter.size === 0
    ? state.items
    : state.items.filter((i) => (i.claimedBy ? ownerFilter.has(i.claimedBy) : ownerFilter.has("unclaimed")));
  const filtered = filterAndSort(ownerFiltered, { type, source, sort, search });
  const inputStyle = { background: C.card, border: `1px solid ${C.cardBorder}`, color: C.ink };

  function applyGoldChange(sign) {
    const denom = state.currency.find((d) => d.id === addDenom) || state.currency[0];
    const amount = parseFloat(addAmount) || 0;
    if (!amount) return;
    actions.adjustPartyGold(Math.round(amount * denom.value) * sign);
    setAddAmount("");
  }
  function doSplit() {
    const n = state.players.length;
    if (n === 0) { setSplitMsg("Add some players first — there's no one to split with."); return; }
    const share = Math.floor(state.party.gold / n);
    if (share <= 0) { setSplitMsg("Not enough gold in the party pot for an even split."); return; }
    const remainder = state.party.gold - share * n;
    actions.splitGoldEqually();
    const shareText = breakdown(share, state.currency).map((p) => `${p.count} ${p.abbr}`).join(", ");
    setSplitMsg(`Split into ${n} shares of ${shareText} each.${remainder > 0 ? ` ${remainder} left in the pot (too little to split further).` : ""}`);
  }
  useEffect(() => {
    if (!splitMsg) return;
    const t = setTimeout(() => setSplitMsg(null), 6000);
    return () => clearTimeout(t);
  }, [splitMsg]);

  return (
    <div className="space-y-8">
      <section>
        <h2 className="font-display text-lg mb-2" style={{ color: C.ink }}>Party gold</h2>
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.card, border: `1px solid ${C.cardBorder}` }}>
          <CoinBreakdown base={state.party.gold} denominations={state.currency} />
          <div className="flex flex-wrap items-center gap-2">
            <input type="number" min="0" step="any" value={addAmount} onChange={(e) => setAddAmount(e.target.value)} placeholder="Amount" className="rounded-md px-2 py-1.5 text-sm outline-none w-28" style={inputStyle} />
            <select value={addDenom} onChange={(e) => setAddDenom(e.target.value)} className="rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle}>
              {state.currency.map((d) => <option key={d.id} value={d.id}>{d.abbr}</option>)}
            </select>
            <button onClick={() => applyGoldChange(1)} className="rounded-md px-2 py-1.5 text-sm font-medium" style={{ background: C.green, color: "#fff" }}>+ Add</button>
            <button onClick={() => applyGoldChange(-1)} className="rounded-md px-2 py-1.5 text-sm font-medium" style={{ background: C.red, color: "#fff" }}>− Remove</button>
          </div>
          <div className="pt-2" style={{ borderTop: `1px solid ${C.cardBorder}` }}>
            <button onClick={doSplit} className="rounded-md px-3 py-1.5 text-sm font-medium" style={{ background: C.brass, color: "#fff" }}>Split gold equally</button>
            {splitMsg && <p className="text-sm mt-2" style={{ color: C.inkMuted }}>{splitMsg}</p>}
          </div>
        </div>
      </section>
      <section>
        <h2 className="font-display text-lg mb-2" style={{ color: C.ink }}>Party inventory</h2>
        <p className="text-sm mb-3" style={{ color: C.inkMuted }}>Everything the party has found, whether it's still up for grabs or already claimed by someone.</p>
        <OwnerFilter players={state.players} selected={ownerFilter} onToggle={toggleOwner} onClear={() => setOwnerFilter(new Set())} />
        <FilterBar items={state.items} type={type} setType={setType} source={source} setSource={setSource} sort={sort} setSort={setSort} search={search} setSearch={setSearch} />
        {filtered.length === 0 ? (
          <p className="text-sm" style={{ color: C.inkMuted }}>{state.items.length === 0 ? "The loot pile is empty. The DM can add items in the Dungeon Master tab." : "Nothing matches those filters."}</p>
        ) : (
          <div className="space-y-2">
            {filtered.map((item) => (
              <LootRow key={item.id} item={item} denominations={state.currency} players={state.players}
                right={!item.claimedBy ? (
                  state.players.length === 0 ? (
                    <span className="text-xs" style={{ color: C.inkMuted }}>Add players to claim</span>
                  ) : (
                    <div className="flex items-center gap-2">
                      <select value={claimSelections[item.id] || state.players[0].id} onChange={(e) => setClaimSelections({ ...claimSelections, [item.id]: e.target.value })}
                        className="rounded-md px-2 py-1 text-xs outline-none" style={{ background: "#fff", border: `1px solid ${C.cardBorder}`, color: C.ink }}>
                        {state.players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <button onClick={() => actions.claimItem(item.id, claimSelections[item.id] || state.players[0].id)}
                        className="rounded-md px-2 py-1 text-xs font-medium" style={{ background: C.green, color: "#fff" }}>Claim</button>
                    </div>
                  )
                ) : (
                  <button onClick={() => actions.releaseItem(item.id)} className="rounded-md px-2 py-1 text-xs font-medium" style={{ border: `1px solid ${C.cardBorder}`, color: C.inkMuted }}>Return to party</button>
                )} />
            ))}
          </div>
        )}
      </section>
    </div>
  );
}

/* ---------------- Player Tab ---------------- */
function PlayerTab({ state, actions }) {
  const [viewId, setViewId] = useState(state.players[0]?.id || "");
  const [goldAmount, setGoldAmount] = useState("");
  const [goldDenom, setGoldDenom] = useState(state.currency[state.currency.length - 1]?.id || "");
  const [goldMsg, setGoldMsg] = useState(null);

  useEffect(() => {
    if (!state.players.find((p) => p.id === viewId)) setViewId(state.players[0]?.id || "");
  }, [state.players]);

  useEffect(() => {
    if (!goldMsg) return;
    const t = setTimeout(() => setGoldMsg(null), 4000);
    return () => clearTimeout(t);
  }, [goldMsg]);

  if (state.players.length === 0) {
    return <p className="text-sm" style={{ color: C.inkMuted }}>No players yet. Ask your DM to add the party in the Dungeon Master tab.</p>;
  }
  const player = state.players.find((p) => p.id === viewId) || state.players[0];
  const myItems = state.items.filter((i) => i.claimedBy === player.id);
  const unclaimed = filterAndSort(state.items.filter((i) => !i.claimedBy), { type: "all", source: "all", sort: "newest", search: "" });
  const inputStyle = { background: C.card, border: `1px solid ${C.cardBorder}`, color: C.ink };

  function goldBaseAmount() {
    const denom = state.currency.find((d) => d.id === goldDenom) || state.currency[0];
    const amount = parseFloat(goldAmount) || 0;
    return Math.round(amount * denom.value);
  }
  function handleSendToParty() {
    const base = goldBaseAmount();
    if (base <= 0) return;
    if (base > player.gold) { setGoldMsg("You don't have that much coin."); return; }
    actions.sendGoldToParty(player.id, base);
    setGoldMsg(`Sent to the party pot.`);
    setGoldAmount("");
  }
  function handleDiscard() {
    const base = goldBaseAmount();
    if (base <= 0) return;
    if (base > player.gold) { setGoldMsg("You don't have that much coin."); return; }
    actions.discardPlayerGold(player.id, base);
    setGoldMsg(`Removed from your coin purse.`);
    setGoldAmount("");
  }

  return (
    <div className="space-y-8">
      <div className="flex flex-wrap gap-1.5">
        {state.players.map((p) => (
          <button
            key={p.id}
            onClick={() => setViewId(p.id)}
            className="rounded-md px-3 py-1.5 text-sm font-medium"
            style={
              p.id === player.id
                ? { background: C.brass, color: "#fff" }
                : { background: C.card, border: `1px solid ${C.cardBorder}`, color: C.inkMuted }
            }
          >
            {p.name}
          </button>
        ))}
      </div>

      <section>
        <h2 className="font-display text-lg mb-2" style={{ color: C.ink }}>{player.name}'s coin</h2>
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.card, border: `1px solid ${C.cardBorder}` }}>
          <CoinBreakdown base={player.gold} denominations={state.currency} />
          <div className="flex flex-wrap items-center gap-2">
            <input type="number" min="0" step="any" value={goldAmount} onChange={(e) => setGoldAmount(e.target.value)} placeholder="Amount" className="rounded-md px-2 py-1.5 text-sm outline-none w-28" style={inputStyle} />
            <select value={goldDenom} onChange={(e) => setGoldDenom(e.target.value)} className="rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle}>
              {state.currency.map((d) => <option key={d.id} value={d.id}>{d.abbr}</option>)}
            </select>
            <button onClick={handleSendToParty} className="rounded-md px-2 py-1.5 text-sm font-medium" style={{ background: C.brass, color: "#fff" }}>Send to party pot</button>
            <button onClick={handleDiscard} className="rounded-md px-2 py-1.5 text-sm font-medium" style={{ background: C.red, color: "#fff" }}>Remove coins</button>
          </div>
          {goldMsg && <p className="text-sm" style={{ color: C.inkMuted }}>{goldMsg}</p>}
        </div>
      </section>

      <section>
        <h2 className="font-display text-lg mb-2" style={{ color: C.ink }}>{player.name}'s inventory</h2>
        {myItems.length === 0 ? (
          <p className="text-sm" style={{ color: C.inkMuted }}>Nothing claimed yet. Browse the party loot below.</p>
        ) : (
          <div className="space-y-2">
            {myItems.map((item) => (
              <LootRow key={item.id} item={item} denominations={state.currency} players={state.players}
                right={<button onClick={() => actions.releaseItem(item.id)} className="rounded-md px-2 py-1 text-xs font-medium" style={{ border: `1px solid ${C.cardBorder}`, color: C.inkMuted }}>Return to party</button>} />
            ))}
          </div>
        )}
      </section>
      <section>
        <h2 className="font-display text-lg mb-2" style={{ color: C.ink }}>Party loot up for grabs</h2>
        {unclaimed.length === 0 ? (
          <p className="text-sm" style={{ color: C.inkMuted }}>No unclaimed items right now.</p>
        ) : (
          <div className="space-y-2">
            {unclaimed.map((item) => (
              <LootRow key={item.id} item={item} denominations={state.currency} players={state.players}
                right={<button onClick={() => actions.claimItem(item.id, player.id)} className="rounded-md px-2 py-1 text-xs font-medium" style={{ background: C.green, color: "#fff" }}>Claim</button>} />
            ))}
          </div>
        )}
      </section>
    </div>
  );
}

/* ---------------- App ---------------- */
const TABS = [
  { id: "dm", label: "Dungeon Master" },
  { id: "party", label: "Party" },
  { id: "player", label: "Player" },
];

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("party");
  const [error, setError] = useState(null);
  const isInitialLoad = useRef(true);

  useEffect(() => {
    function init() {
      return window.ledgerDB.subscribe((data) => {
        setState(data || DEFAULT_STATE);
      });
    }
    let unsub;
    if (window.ledgerDB) unsub = init();
    else window.addEventListener("ledgerdb-ready", () => { unsub = init(); }, { once: true });
    return () => { if (unsub) unsub(); };
  }, []);

  useEffect(() => {
    if (state === null) return;
    if (isInitialLoad.current) { isInitialLoad.current = false; return; }
    window.ledgerDB.setState(state).then(() => setError(null)).catch(() => setError("Couldn't save your last change — check your internet connection."));
  }, [state]);

  const actions = {
    renameParty: (name) => setState((prev) => ({ ...prev, party: { ...prev.party, name } })),
    addPlayer: (name) => setState((prev) => ({ ...prev, players: [...prev.players, { id: genId(), name, gold: 0 }] })),
    removePlayer: (id) => setState((prev) => {
      const player = prev.players.find((p) => p.id === id);
      if (!player) return prev;
      const items = prev.items.map((it) => (it.claimedBy === id ? { ...it, claimedBy: null } : it));
      return { ...prev, players: prev.players.filter((p) => p.id !== id), party: { ...prev.party, gold: prev.party.gold + player.gold }, items };
    }),
    addItem: ({ name, type, source, description, cost }) => setState((prev) => ({ ...prev, items: [...prev.items, { id: genId(), name, type, source, description: description || "", cost, claimedBy: null, addedAt: Date.now() }] })),
    deleteItem: (id) => setState((prev) => ({ ...prev, items: prev.items.filter((i) => i.id !== id) })),
    claimItem: (itemId, playerId) => setState((prev) => ({ ...prev, items: prev.items.map((i) => (i.id === itemId ? { ...i, claimedBy: playerId } : i)) })),
    releaseItem: (itemId) => setState((prev) => ({ ...prev, items: prev.items.map((i) => (i.id === itemId ? { ...i, claimedBy: null } : i)) })),
    adjustPartyGold: (delta) => setState((prev) => ({ ...prev, party: { ...prev.party, gold: Math.max(0, prev.party.gold + delta) } })),
    sendGoldToParty: (playerId, amount) => setState((prev) => {
      const player = prev.players.find((p) => p.id === playerId);
      if (!player) return prev;
      const move = Math.max(0, Math.min(amount, player.gold));
      if (move <= 0) return prev;
      return {
        ...prev,
        party: { ...prev.party, gold: prev.party.gold + move },
        players: prev.players.map((p) => (p.id === playerId ? { ...p, gold: p.gold - move } : p)),
      };
    }),
    discardPlayerGold: (playerId, amount) => setState((prev) => {
      const player = prev.players.find((p) => p.id === playerId);
      if (!player) return prev;
      const remove = Math.max(0, Math.min(amount, player.gold));
      if (remove <= 0) return prev;
      return { ...prev, players: prev.players.map((p) => (p.id === playerId ? { ...p, gold: p.gold - remove } : p)) };
    }),
    splitGoldEqually: () => setState((prev) => {
      const n = prev.players.length;
      if (n === 0) return prev;
      const share = Math.floor(prev.party.gold / n);
      if (share <= 0) return prev;
      const remainder = prev.party.gold - share * n;
      return { ...prev, party: { ...prev.party, gold: remainder }, players: prev.players.map((p) => ({ ...p, gold: p.gold + share })) };
    }),
    saveCurrency: (denominations) => setState((prev) => ({ ...prev, currency: denominations })),
  };

  if (state === null) {
    return <div className="min-h-screen w-full flex items-center justify-center" style={{ background: C.cover, color: C.coverTextDim }}>Opening the ledger…</div>;
  }

  return (
    <div className="min-h-screen w-full" style={{ background: C.cover }}>
      <div className="max-w-3xl mx-auto pb-10">
        <header className="px-6 pt-6 pb-1">
          <h1 className="font-display text-3xl" style={{ color: C.coverText }}>{state.party.name}</h1>
          <p className="text-sm mt-1" style={{ color: C.coverTextDim }}>Shared loot and coin ledger. Everyone with the link sees the same data, live.</p>
          {error && <p className="text-sm mt-1" style={{ color: "#E7A79A" }}>{error}</p>}
        </header>
        <div className="flex gap-1 px-4 pt-4" style={{ borderBottom: `2px solid ${C.brass}` }}>
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className="px-4 py-2 rounded-t-xl font-display text-base"
              style={tab === t.id
                ? { background: C.page, color: C.ink, border: `2px solid ${C.brass}`, borderBottom: `2px solid ${C.page}`, marginBottom: "-2px", fontWeight: 600 }
                : { background: "transparent", color: C.coverTextDim, border: "2px solid transparent" }}>
              {t.label}
            </button>
          ))}
        </div>
        <main className="p-5 rounded-b-xl" style={{ background: C.page, minHeight: 420 }}>
          {tab === "dm" && <DMTab state={state} actions={actions} />}
          {tab === "party" && <PartyTab state={state} actions={actions} />}
          {tab === "player" && <PlayerTab state={state} actions={actions} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
